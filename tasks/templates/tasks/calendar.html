<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
</head>
<body>
    <h1>Calendar for {{ year }}-{{ month }}</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Sun</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
            </tr>
        </thead>
        <tbody>
            {% for week in events_by_day.values %}
                <tr>
                    {% for day in week %}
                        <td>
                            {{ day }}
                            {% for event in events_by_day[day] %}
                                <br>{{ event.title }}
                            {% endfor %}
                        </td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
